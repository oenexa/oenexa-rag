# ==============================================================================
# OENEXA Vector Retrieval & RAG Service — Standalone Stack
# ==============================================================================

version: "3.8"

services:
  oenexa-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oenexa-rag-standalone
    ports:
      - "8087:8087"
    environment:
      PORT: "8087"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8087/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
